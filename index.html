
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FocusFlow - Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <div>
                <h1>FocusFlow</h1>
                <p class="subtitle">Student Task Manager</p>
            </div>

            <button id="themeButton">🌙</button>
        </div>

        <p class="description">
            Organize your daily tasks and stay productive.
        </p>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addTaskButton">Add Task</button>

        </div>

        <div class="task-info">
            <span>Total Tasks: <span id="totalTasks">0</span></span>
            <span>Completed: <span id="completedTasks">0</span></span>
        </div>

        <div class="progress-section">

            <div class="progress-heading">
                <span>Task Progress</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks added yet.</p>

    </div>

    <script src="app.js"></script>

</body>
</html>
